<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f3ee">
<title>THE WALL ! — Explore a category</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--paper:#f5f3ee;--ink:#171717;--orange:#ff5a1f;--muted:#77756f;--line:rgba(23,23,23,.22)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,Arial,sans-serif}
.topbar{height:62px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(245,243,238,.95);z-index:5}
.logo{font:700 23px "Space Grotesk";letter-spacing:-1.8px;color:inherit;text-decoration:none}.logo span{color:var(--orange)}
.back{font-size:11px;font-weight:800;text-decoration:none;color:inherit;text-transform:uppercase;letter-spacing:.08em}
main{padding:7vw 7vw 90px}.eyebrow{font:10px "DM Mono";letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
h1{font:700 clamp(48px,10vw,112px)/.95 "Space Grotesk";letter-spacing:-.08em;margin:20px 0 16px}
.intro{color:var(--muted);max-width:560px;line-height:1.7;margin-bottom:42px}
.category-links{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:38px}.category-links a{border:1px solid var(--line);padding:9px 13px;color:inherit;text-decoration:none;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.category-links a:hover,.category-links a.active{background:var(--ink);color:white}
.status{color:var(--muted);font-size:13px;padding:18px 0}
.posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.post{border:1px solid var(--line);padding:16px;min-width:0}.post h2{font:700 23px "Space Grotesk";margin:10px 0}.post p{font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.meta{font:10px "DM Mono";color:var(--orange);text-transform:uppercase;letter-spacing:.08em}
.media{display:grid;gap:7px;margin-bottom:14px}.media img,.media video{width:100%;max-height:360px;object-fit:cover;background:#e6e2d9}
.empty{border:1px dashed var(--line);padding:35px;line-height:1.7;color:var(--muted)}
@media(max-width:850px){.posts{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){main{padding:50px 6vw}.posts{grid-template-columns:1fr}.topbar{padding:0 6vw}}
</style>
</head>
<body>
<header class="topbar"><a class="logo" href="index.html">THE WALL<span> !</span></a><a class="back" href="index.html">← Volver al inicio</a></header>
<main>
<div class="eyebrow">THE WALL / EXPLORE</div>
<h1 id="pageTitle">ALL CREATIVITY.</h1>
<p class="intro" id="pageIntro">Descubre obras y publicaciones de la comunidad THE WALL.</p>
<nav class="category-links" aria-label="Categorías">
<a href="category.html?category=All%20creativity" data-name="All creativity">All creativity</a>
<a href="category.html?category=Fashion" data-name="Fashion">Fashion</a>
<a href="category.html?category=Painting" data-name="Painting">Painting</a>
<a href="category.html?category=Sculpture" data-name="Sculpture">Sculpture</a>
<a href="category.html?category=Tattoo" data-name="Tattoo">Tattoo</a>
<a href="category.html?category=Photography" data-name="Photography">Photography</a>
<a href="category.html?category=Music" data-name="Music">Music</a>
<a href="category.html?category=Dance" data-name="Dance">Dance</a>
<a href="category.html?category=Digital%20art" data-name="Digital art">Digital art</a>
<a href="category.html?category=Handmade" data-name="Handmade">Handmade</a>
<a href="category.html?category=Other" data-name="Other">Other</a>
</nav>
<div id="status" class="status" aria-live="polite">Cargando publicaciones…</div>
<div id="posts" class="posts"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://qefvmxppuqmximwlinla.supabase.co';
const SUPABASE_KEY='sb_publishable_taFYDEBZXdx6CIYXXJT7cA_LWFUTqG_';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const params=new URLSearchParams(location.search);
const requested=(params.get('category')||'All creativity').trim();
const allowed=['All creativity','Fashion','Painting','Sculpture','Tattoo','Photography','Music','Dance','Digital art','Handmade','Other'];
const category=allowed.find(x=>x.toLowerCase()===requested.toLowerCase())||'All creativity';
document.title='THE WALL ! — '+category;
document.querySelector('#pageTitle').textContent=category.toUpperCase()+'.';
document.querySelector('#pageIntro').textContent=category==='All creativity'?'Explora todas las disciplinas y descubre nuevas voces de THE WALL.':'Explora las creaciones públicas de la categoría '+category+'.';
document.querySelectorAll('.category-links a').forEach(a=>{if(a.dataset.name===category)a.classList.add('active')});
const status=document.querySelector('#status'),posts=document.querySelector('#posts');
function make(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}
async function signedMedia(path){if(/^https?:\\/\\//i.test(path||''))return path;const {data,error}=await db.storage.from('wall media').createSignedUrl(path,3600);return error?null:data?.signedUrl||null}
async function render(){
 try{
  let query=db.from('wall_posts').select('id,title,content,category,media_url,created_at,visibility,scheduled_at').in('visibility',['PUBLIC','SCHEDULED']).order('created_at',{ascending:false});
  const {data,error}=await query;if(error)throw error;
  const rows=(data||[]).filter(p=>category==='All creativity'||(p.category||'').toLowerCase()===category.toLowerCase());
  if(!rows.length){status.textContent='Todavía no hay publicaciones públicas en esta categoría.';posts.append(make('div','empty','Esta sección ya está preparada. Cuando se publiquen obras de esta disciplina, aparecerán aquí.'));return}
  status.textContent=rows.length+' publicación'+(rows.length===1?'':'es')+' encontrada'+(rows.length===1?'':'s')+'.';
  for(const post of rows){
   const card=make('article','post'),media=make('div','media');
   const {data:items}=await db.from('wall_post_media').select('media_url,media_type,display_order').eq('post_id',post.id).order('display_order',{ascending:true});
   const files=items||[];
   if(files.length){
    for(const file of files){
     const url=await signedMedia(file.media_url);if(!url)continue;
     const el=make(file.media_type==='video'?'video':'img');
     el.src=url;if(file.media_type==='video'){el.controls=true;el.preload='metadata'}else{el.alt=post.title||'Obra de THE WALL';el.loading='lazy'}
     media.append(el);
    }
   }else if(post.media_url){const url=await signedMedia(post.media_url);if(url){const img=make('img');img.src=url;img.alt=post.title||'Obra de THE WALL';img.loading='lazy';media.append(img)}}
   if(media.children.length)card.append(media);
   card.append(make('div','meta',post.category||'CREATION'),make('h2','',post.title||'Untitled'),make('p','',post.content||''));
   posts.append(card);
  }
 }catch(error){console.error(error);status.textContent='No se pudieron cargar las publicaciones. Inténtalo de nuevo más tarde.'}
}
render();
</script>
</body>
</html>
